<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Booking App</title>
  <style>
    :root { --bg: #f7f7f5; --card: #fff; --ink: #1d1d1b; --muted: #6b6b66; --accent: #2f5d50; --error: #a33a2b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    section { background: var(--card); border: 1px solid #e4e4df; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    h2 { margin: 0 0 16px; font-size: 1.1rem; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; }
    input, select { padding: 8px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    .full { grid-column: 1 / -1; }
    button { padding: 10px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: var(--error); padding: 4px 8px; }
    #message { min-height: 1.2em; margin: 12px 0 0; }
    #message.error { color: var(--error); }
    #message.success { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Booking App</h1>
    <p class="lead">The system under test for <em>Agentic QA</em>. Data resets every time the server starts.</p>

    <section aria-labelledby="new-booking-title">
      <h2 id="new-booking-title">New booking</h2>
      <form id="booking-form" novalidate>
        <label class="full">Guest name
          <input id="guestName" name="guestName" autocomplete="off" />
        </label>
        <label>Room
          <select id="roomId" name="roomId"></select>
        </label>
        <label>Guests
          <input id="guests" name="guests" type="number" min="1" value="1" />
        </label>
        <label>Check-in
          <input id="checkIn" name="checkIn" type="date" />
        </label>
        <label>Check-out
          <input id="checkOut" name="checkOut" type="date" />
        </label>
        <div class="full">
          <button type="submit">Book room</button>
          <p id="message" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section aria-labelledby="bookings-title">
      <h2 id="bookings-title">Bookings</h2>
      <table aria-label="Bookings">
        <thead>
          <tr><th>Guest</th><th>Room</th><th>Guests</th><th>Check-in</th><th>Check-out</th><th></th></tr>
        </thead>
        <tbody id="bookings-body"></tbody>
      </table>
    </section>
  </main>

  <script>
    const form = document.getElementById("booking-form");
    const roomSelect = document.getElementById("roomId");
    const guestsInput = document.getElementById("guests");
    const message = document.getElementById("message");
    const tbody = document.getElementById("bookings-body");
    let rooms = [];

    function setMessage(text, kind) {
      message.textContent = text;
      message.className = kind || "";
    }

    function syncGuestLimit() {
      const room = rooms.find((r) => r.id === roomSelect.value);
      if (room) guestsInput.max = String(room.capacity);
    }

    async function loadRooms() {
      rooms = await (await fetch("/api/rooms")).json();
      roomSelect.innerHTML = rooms
        .map((r) => `<option value="${r.id}">${r.name} (up to ${r.capacity}) – $${r.pricePerNight}/night</option>`)
        .join("");
      syncGuestLimit();
    }

    async function loadBookings() {
      const bookings = await (await fetch("/api/bookings")).json();
      if (bookings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty">No bookings yet.</td></tr>`;
        return;
      }
      tbody.innerHTML = "";
      for (const b of bookings) {
        const room = rooms.find((r) => r.id === b.roomId);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td></td><td></td><td>${b.guests}</td><td>${b.checkIn}</td><td>${b.checkOut}</td><td></td>`;
        tr.children[0].textContent = b.guestName;
        tr.children[1].textContent = room ? room.name : b.roomId;
        const cancel = document.createElement("button");
        cancel.className = "secondary";
        cancel.textContent = "Cancel";
        cancel.setAttribute("aria-label", `Cancel booking for ${b.guestName}`);
        cancel.addEventListener("click", async () => {
          await fetch(`/api/bookings/${b.id}`, { method: "DELETE" });
          setMessage("Booking cancelled.", "success");
          loadBookings();
        });
        tr.children[5].appendChild(cancel);
        tbody.appendChild(tr);
      }
    }

    roomSelect.addEventListener("change", syncGuestLimit);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const guests = Number(guestsInput.value);
      if (guestsInput.max && guests > Number(guestsInput.max)) {
        const max = Number(guestsInput.max);
        setMessage(`This room fits up to ${max} ${max === 1 ? "guest" : "guests"}.`, "error");
        return;
      }
      const body = {
        guestName: form.guestName.value,
        roomId: roomSelect.value,
        guests,
        checkIn: form.checkIn.value,
        checkOut: form.checkOut.value,
      };
      const res = await fetch("/api/bookings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        setMessage(data.errors.join(". ") + ".", "error");
        return;
      }
      setMessage(`Booking confirmed for ${data.guestName}.`, "success");
      form.reset();
      syncGuestLimit();
      loadBookings();
    });

    loadRooms().then(loadBookings);
  </script>
</body>
</html>
